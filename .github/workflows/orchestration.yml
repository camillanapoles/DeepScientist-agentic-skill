name: Orchestration & OMP runner (Pydantic + Instructor)

on:
  push:
    branches:
      - '**'
    paths:
      - '.github/workflows/orchestration.yml'
      - 'src/deepscientist/orchestration/**'
      - 'src/deepscientist/runners/omp.py'
      - 'src/deepscientist/runners/metadata.py'
      - 'src/deepscientist/runners/builtins.py'
      - 'src/deepscientist/config/models.py'
      - 'skills/deepscientist-linux-agent-setup/**'
      - 'scripts/audits/audit_linux_agent_skill.py'
      - 'tests/orchestration/**'
      - 'pyproject.toml'
  pull_request:
    paths:
      - '.github/workflows/orchestration.yml'
      - 'src/deepscientist/orchestration/**'
      - 'src/deepscientist/runners/omp.py'
      - 'src/deepscientist/runners/metadata.py'
      - 'src/deepscientist/runners/builtins.py'
      - 'src/deepscientist/config/models.py'
      - 'skills/deepscientist-linux-agent-setup/**'
      - 'scripts/audits/audit_linux_agent_skill.py'
      - 'tests/orchestration/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  orchestration-tests:
    name: Deterministic engine + Pydantic schemas + Instructor + OMP + Linux skill
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies (incl. pydantic + instructor)
        run: |
          python -m pip install --upgrade pip
          pip install -e .
          pip install pytest

      - name: Compile orchestration and runner modules
        run: |
          python -m py_compile src/deepscientist/orchestration/*.py
          python -m py_compile src/deepscientist/runners/omp.py

      - name: Assert no text-templating engine (Jinja2 etc.) in skill or src
        run: |
          # Forbid real template-engine USAGE, not string mentions inside detectors.
          # 1) imports / engine instantiation in Python
          if grep -rniE "^[[:space:]]*(import|from)[[:space:]]+(jinja|mako|cheetah)|(jinja2|mako|cheetah)\.(Environment|Template)" \
               src/deepscientist/orchestration skills/deepscientist-linux-agent-setup \
               --include="*.py" 2>/dev/null; then
            echo "Found text-templating engine import/instantiation" >&2
            exit 1
          fi
          # 2) template interpolation syntax anywhere
          if grep -rnE "\{\{|\{%" \
               src/deepscientist/orchestration skills/deepscientist-linux-agent-setup \
               --include="*.md" --include="*.yaml" --include="*.yml" --include="*.txt" 2>/dev/null; then
            echo "Found template interpolation syntax" >&2
            exit 1
          fi
          # 3) template files on disk
          if find src/deepscientist/orchestration skills/deepscientist-linux-agent-setup \
               \( -name "*.j2" -o -name "*.jinja" -o -name "*.jinja2" -o -name "*.tmpl" \) | grep -q .; then
            echo "Found forbidden template file" >&2
            exit 1
          fi
          echo "No text templating engine found — Pydantic-only."

      - name: Run orchestration tests (engine, schemas, closed-loop, LLM)
        run: pytest tests/orchestration/ -q

      - name: Audit Windows/WSL skill (regression)
        run: python scripts/audits/audit_windows_wsl_skill.py

      - name: Audit Linux agent skill (Pydantic playbook render)
        run: python scripts/audits/audit_linux_agent_skill.py

      - name: Detect LLM key presence
        id: llmkey
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          if [ -n "$ZAI_API_KEY" ]; then
            echo "present=yes" >> "$GITHUB_OUTPUT"
          else
            echo "present=no" >> "$GITHUB_OUTPUT"
          fi

      - name: LLM smoke gate (Instructor -> z.ai glm-5.2, only when ZAI_API_KEY secret exists)
        if: steps.llmkey.outputs.present == 'yes'
        env:
          ZAI_API_KEY: ${{ secrets.ZAI_API_KEY }}
        run: |
          python - <<'PY'
          import sys, tempfile
          from pathlib import Path
          sys.path.insert(0, "src")
          from deepscientist.orchestration import OrchestrationService, create_store
          from deepscientist.orchestration.llm import OrchestrationLLM

          llm = OrchestrationLLM()
          assert llm.provider == "zai", f"unexpected provider: {llm.provider}"
          assert llm.model == "glm-5.2", f"unexpected model: {llm.model}"
          assert llm.base_url == "https://api.z.ai/api/coding/paas/v4"
          assert llm.available, f"LLM client unavailable: {llm._init_error}"
          with tempfile.TemporaryDirectory() as td:
              service = OrchestrationService(create_store(Path(td) / "smoke.db"), llm=llm)
              obj = service.create_object(name="ci-llm-smoke", environment="linux")
              result = service.propose_next_action(obj.object_id)
              if not (result.get("ok") and result.get("available")):
                  reason = str(result.get("reason", ""))
                  # Auth failures are a SETUP issue (bad/missing key), not a code
                  # regression: warn and pass so GitOps is not blocked on secrets.
                  if "401" in reason or "403" in reason or "Authentication" in reason:
                      print("::warning::ZAI_API_KEY rejected by endpoint (setup pending) — " + reason[:200])
                      print("LLM SMOKE SKIPPED (auth) — fix the secret at Settings > Secrets > Actions")
                      sys.exit(0)
                  raise AssertionError(f"proposal failed: {reason[:300]}")
              proposal = result["proposal"]
              print("proposed_event_type:", proposal["proposed_event_type"])
              print("confidence:", proposal["confidence"])
          print("LLM SMOKE OK - z.ai glm-5.2 via Instructor")
          PY

